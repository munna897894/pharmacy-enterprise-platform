apiVersion: v1
kind: ConfigMap
metadata:
  name: pharmacy-common
  namespace: pharmacy
data:
  DB_HOST: host.docker.internal
  DB_PORT: "3307"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:9092
  AUTH_SERVICE_HOST: auth-service
  AUTH_SERVICE_PORT: "8081"
  AUTH_DB_NAME: auth_service
  AUTH_DB_USER: auth_user
  PRODUCT_DB_NAME: pharmacy_product
  PRODUCT_DB_USER: product_user
  INVENTORY_DB_NAME: pharmacy_inventory
  INVENTORY_DB_USER: inventory_user
  ORDER_DB_NAME: pharmacy_order
  ORDER_DB_USER: order_user
  PAYMENT_DB_NAME: pharmacy_payment
  PAYMENT_DB_USER: payment_user
  AUDIT_DB_NAME: pharmacy_audit
  AUDIT_DB_USER: audit_user
  CUSTOMER_DB_NAME: pharmacy_customer
  CUSTOMER_DB_USER: customer_user
  PHARMACY_DB_NAME: pharmacy_pharmacy
  PHARMACY_DB_USER: pharmacy_user
  PRESCRIPTION_DB_NAME: prescription_service
  PRESCRIPTION_DB_USER: prescription_user
  NOTIFICATION_DB_NAME: pharmacy_notification
  NOTIFICATION_DB_USER: pharmacy_notification
  INVENTORY_SERVICE_BASE_URL: http://inventory-service:8085
  ORDER_SERVICE_BASE_URL: http://order-service:8087
  PAYMENT_SERVICE_BASE_URL: http://payment-service:8088
