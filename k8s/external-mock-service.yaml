apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-mock-service
  namespace: pharmacy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: external-mock-service
  template:
    metadata:
      labels:
        app: external-mock-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: external-mock-service
          image: pharmacy/external-mock-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: local
            - name: EXTERNAL_MOCK_SERVICE_PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: external-mock-service
  namespace: pharmacy
spec:
  selector:
    app: external-mock-service
  ports:
    - port: 8080
      targetPort: 8080
