apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pharmacy-gateway
  namespace: pharmacy
spec:
  ingressClassName: nginx
  rules:
    - host: pharmacy.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
