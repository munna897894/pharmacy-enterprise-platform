# Example only. Do not apply until a Dynatrace trial is explicitly approved,
# the endpoint is replaced, and the `dynakube` Secret exists in this namespace.
apiVersion: dynatrace.com/v1beta5
kind: DynaKube
metadata:
  name: dynakube
  namespace: dynatrace
spec:
  apiUrl: https://replace-with-environment-id.live.dynatrace.com/api
  oneAgent:
    applicationMonitoring:
      namespaceSelector:
        matchLabels:
          observability.pharmacy/dynatrace-injection: "enabled"
