kube-prometheus-stack:
  grafana:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
        ephemeral-storage: 128Mi
      limits:
        cpu: 300m
        memory: 512Mi
        ephemeral-storage: 1Gi
  prometheus:
    prometheusSpec:
      retention: 3d
      retentionSize: 4GB
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
          ephemeral-storage: 1Gi
        limits:
          cpu: 1
          memory: 1Gi
          ephemeral-storage: 5Gi
      storageSpec:
        emptyDir:
          sizeLimit: 5Gi

loki:
  loki:
    limits_config:
      retention_period: 168h
  singleBinary:
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
        ephemeral-storage: 1Gi
      limits:
        cpu: 1
        memory: 1536Mi
        ephemeral-storage: 5Gi
    persistence:
      enabled: false

tempo:
  tempo:
    retention: 72h
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
        ephemeral-storage: 1Gi
      limits:
        cpu: 1
        memory: 1Gi
        ephemeral-storage: 4Gi
  persistence:
    enabled: false

opentelemetry-collector:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

alloy:
  clusterName: pharmacy-eks
  alloy:
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        cpu: 300m
        memory: 256Mi

kafkaExporter:
  enabled: true
  kafkaServer: kafka.pharmacy.svc.cluster.local:9092
  namespace: pharmacy
