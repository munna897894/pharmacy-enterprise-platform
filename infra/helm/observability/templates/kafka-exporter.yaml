{{- if .Values.kafkaExporter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-kafka-exporter
  namespace: {{ .Values.kafkaExporter.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kafka-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-exporter
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-exporter
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka-exporter
          image: "{{ .Values.kafkaExporter.image.repository }}:{{ .Values.kafkaExporter.image.tag }}"
          imagePullPolicy: IfNotPresent
          args:
            - --kafka.server={{ required "kafkaExporter.kafkaServer is required when Kafka exporter is enabled" .Values.kafkaExporter.kafkaServer }}
            - --web.listen-address=:9308
          ports:
            - name: metrics
              containerPort: 9308
              protocol: TCP
          resources:
            {{- toYaml .Values.kafkaExporter.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-kafka-exporter
  namespace: {{ .Values.kafkaExporter.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kafka-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "9308"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kafka-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: metrics
      port: 9308
      targetPort: metrics
      protocol: TCP
{{- end }}
