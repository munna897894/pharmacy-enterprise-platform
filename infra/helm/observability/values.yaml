kube-prometheus-stack:
  grafana:
    enabled: true
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 512Mi
    persistence:
      enabled: true
      type: pvc
      size: 1Gi
    service:
      type: ClusterIP
    ingress:
      enabled: false
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
    additionalDataSources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://pharmacy-observability-loki:3100
        jsonData:
          derivedFields:
            - name: Trace (JSON)
              matcherRegex: '"traceId"\s*:\s*"([0-9a-f]{32})"'
              datasourceUid: tempo
              url: '${__value.raw}'
            - name: Trace (console)
              matcherRegex: '\[[^,\]]*,([0-9a-f]{32}),'
              datasourceUid: tempo
              url: '${__value.raw}'
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://pharmacy-observability-tempo:3100
  prometheus:
    service:
      type: ClusterIP
    prometheusSpec:
      replicas: 1
      retention: 3d
      retentionSize: 3GB
      scrapeInterval: 30s
      evaluationInterval: 30s
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 768Mi
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 4Gi
      additionalScrapeConfigs:
        - job_name: pharmacy-platform
          kubernetes_sd_configs:
            - role: endpoints
          relabel_configs:
            - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
              action: keep
              regex: "true"
            - source_labels: [__meta_kubernetes_namespace]
              action: keep
              regex: pharmacy|pharmacy-observability
            - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
              action: replace
              target_label: __address__
              regex: "([^:;]+)(?::\\d+)?;(\\d+)"
              replacement: "$1:$2"
            - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [__meta_kubernetes_namespace]
              action: replace
              target_label: namespace
            - source_labels: [__meta_kubernetes_service_name]
              action: replace
              target_label: service
            - source_labels: [__meta_kubernetes_pod_name]
              action: replace
              target_label: pod
      additionalPrometheusRulesMap:
        pharmacy-observability:
          groups:
            - name: pharmacy-platform
              rules:
                - alert: PharmacyServiceDown
                  expr: up{job="pharmacy-platform"} == 0
                  for: 2m
                  labels:
                    severity: critical
                  annotations:
                    summary: "A pharmacy service cannot be scraped"
                - alert: PharmacyHighHttp5xxRate
                  expr: |
                    sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
                    / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001) > 0.05
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "HTTP 5xx ratio exceeds 5%"
                - alert: PharmacyHighHttpP95Latency
                  expr: |
                    histogram_quantile(0.95,
                      sum by (le, service, uri) (rate(http_server_requests_seconds_bucket[5m]))
                    ) > 1
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "HTTP p95 latency exceeds one second"
                - alert: PharmacyHikariPendingConnections
                  expr: max by (service) (hikaricp_connections_pending) > 0
                  for: 2m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Hikari pool has pending connection requests"
                - alert: PharmacyKafkaConsumerLagHigh
                  expr: max by (consumergroup, topic) (kafka_consumergroup_lag) > 100
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Kafka consumer lag exceeds 100 records"
                - alert: PharmacyDeadLetterTopicActive
                  expr: sum by (topic) (increase(kafka_topic_partition_current_offset{topic=~".*\\.dlt"}[5m])) > 0
                  for: 1m
                  labels:
                    severity: warning
                  annotations:
                    summary: "A dead-letter topic received records in the last five minutes"
                - alert: PharmacyOutboxOldEvent
                  expr: max by (service) (pharmacy_outbox_oldest_unpublished_seconds) > 300
                  for: 2m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Oldest unpublished outbox event is older than five minutes"
                - alert: PharmacyJvmHeapHigh
                  expr: |
                    max by (service) (
                      jvm_memory_used_bytes{area="heap"}
                      / jvm_memory_max_bytes{area="heap"}
                    ) > 0.85
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "JVM heap usage exceeds 85%"
                - alert: PharmacyContainerRestarts
                  expr: increase(kube_pod_container_status_restarts_total{namespace="pharmacy"}[15m]) > 2
                  for: 2m
                  labels:
                    severity: warning
                  annotations:
                    summary: "A pharmacy container restarted more than twice in 15 minutes"

loki:
  lokiCanary:
    enabled: false
  test:
    enabled: false
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage:
      type: filesystem
    limits_config:
      allow_structured_metadata: true
      retention_period: 72h
    compactor:
      retention_enabled: true
      working_directory: /var/loki/compactor
      delete_request_store: filesystem
  gateway:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  singleBinary:
    replicas: 1
    annotations: {}
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 768Mi
    persistence:
      enabled: true
      size: 5Gi
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

tempo:
  tempo:
    reportingEnabled: false
    retention: 24h
    memBallastSizeMbs: 64
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 768Mi
    metricsGenerator:
      enabled: false
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
  persistence:
    enabled: true
    size: 5Gi
  service:
    type: ClusterIP

opentelemetry-collector:
  mode: deployment
  replicaCount: 1
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.117.0
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi
  service:
    type: ClusterIP
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/path: /metrics
      prometheus.io/port: "8889"
  ports:
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
      protocol: TCP
    otlp-http:
      enabled: true
      containerPort: 4318
      servicePort: 4318
      protocol: TCP
    metrics:
      enabled: true
      containerPort: 8888
      servicePort: 8888
      protocol: TCP
    prom-exporter:
      enabled: true
      containerPort: 8889
      servicePort: 8889
      protocol: TCP
  config:
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
        spike_limit_mib: 64
        limit_percentage: null
        spike_limit_percentage: null
      batch:
        timeout: 5s
    exporters:
      otlp/tempo:
        endpoint: pharmacy-observability-tempo:4317
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
        namespace: pharmacy_otel
    service:
      telemetry:
        metrics:
          address: ${env:MY_POD_IP}:8888
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus]

alloy:
  clusterName: pharmacy-kubernetes
  controller:
    type: deployment
    replicas: 1
  rbac:
    create: true
  service:
    enabled: false
  alloy:
    enableReporting: false
    configMap:
      content: |
        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pharmacy_pods" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            action        = "keep"
            regex         = "pharmacy"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_container_init"]
            action        = "drop"
            regex         = "true"
          }

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app"]
            separator     = ";"
            regex         = ";*([^;]+).*"
            target_label  = "app"
          }

          rule {
            source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
            separator     = "/"
            target_label  = "job"
          }
        }

        loki.source.kubernetes "pods" {
          targets    = discovery.relabel.pharmacy_pods.output
          forward_to = [loki.process.pharmacy.receiver]
        }

        loki.process "pharmacy" {
          stage.static_labels {
            values = {
              cluster = "{{ .Values.clusterName }}",
            }
          }

          forward_to = [loki.write.default.receiver]
        }

        loki.write "default" {
          endpoint {
            url = "http://pharmacy-observability-loki:3100/loki/api/v1/push"
          }
        }

kafkaExporter:
  enabled: false
  kafkaServer: ""
  namespace: ""
  image:
    repository: danielqsj/kafka-exporter
    tag: v1.10.0
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 96Mi
