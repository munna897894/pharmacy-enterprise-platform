# Rendered and applied ONLY when gateway_exposure=alb-https (opt-in). The
# default port-forward mode creates no public entry point at all.
#
# HTTPS-only, internet-facing ALB fronting ONLY api-gateway (all public traffic
# enters through the gateway; no other service is ever exposed):
#   - single HTTPS:443 listener with a caller-supplied, ISSUED ACM certificate;
#   - NO HTTP:80 listener and NO redirect: a redirect still lets a client send
#     a login password or bearer token in plaintext on its first request;
#   - TLS 1.2+/1.3 policy;
#   - security group (Terraform-managed) admits 443 only from explicit /32s;
#   - host rule, so requests for any other Host header get the ALB's default
#     404 instead of reaching the gateway.
# Synthetic data does not make plaintext credentials acceptable, and the /32
# allowlist remains mandatory because registration still accepts
# caller-supplied roles (see docs/aws-plan-review.md).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pharmacy-ingress
  namespace: pharmacy
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/security-groups: __ALB_SECURITY_GROUP_ID__
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
    alb.ingress.kubernetes.io/tags: __AWS_RESOURCE_TAGS__
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: __GATEWAY_CERTIFICATE_ARN__
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/healthcheck-port: "9081"
spec:
  ingressClassName: alb
  rules:
    - host: __GATEWAY_HOSTNAME__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
