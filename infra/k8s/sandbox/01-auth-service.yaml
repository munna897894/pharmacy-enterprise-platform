# Placeholders (__UPPER_SNAKE__) are substituted by scripts/aws-apply.sh from
# `terraform output` values before `kubectl apply` — never hand-edit committed
# ARNs/endpoints/image URIs directly into this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: pharmacy
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: auth-service
      initContainers:
        # Fetches DB credentials + JWT RSA keypair from Secrets Manager using
        # the pod's IRSA-scoped IAM role (no static AWS keys anywhere) and
        # writes them to an emptyDir volume the main container reads at boot.
        - name: fetch-secrets
          image: amazon/aws-cli:2.17.0
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              aws secretsmanager get-secret-value --region __AWS_REGION__ \
                --secret-id __AUTH_DB_SECRET_ARN__ --query SecretString --output text \
                | tee /secrets/db.json
              aws secretsmanager get-secret-value --region __AWS_REGION__ \
                --secret-id __JWT_KEYPAIR_SECRET_ARN__ --query SecretString --output text \
                | tee /secrets/jwt.json
              python - <<'PYEOF'
              import json
              db = json.load(open("/secrets/db.json"))
              jwt = json.load(open("/secrets/jwt.json"))
              open("/secrets/db_password", "w").write(db["password"])
              open("/secrets/private_key.pem", "w").write(jwt["private_key_pem"])
              open("/secrets/public_key.pem", "w").write(jwt["public_key_pem"])
              PYEOF
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /secrets
      containers:
        - name: auth-service
          image: __AUTH_SERVICE_IMAGE__
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Wrapper reads the password fetched by the init container into an
          # env var (Kubernetes has no native "env from file" mechanism),
          # then execs the image's normal entrypoint.
          command: ["/bin/sh", "-c"]
          args:
            - export DB_PASSWORD="$(cat /secrets/db_password)"; exec java -jar /app/app.jar
          ports:
            - containerPort: 8081
          env:
            - name: DB_HOST
              value: "__RDS_ENDPOINT__"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: "auth_service"
            - name: DB_USER
              value: "auth_user"
            - name: JWT_PRIVATE_KEY_PATH
              value: "/secrets/private_key.pem"
            - name: JWT_PUBLIC_KEY_PATH
              value: "/secrets/public_key.pem"
            - name: JWT_ISSUER
              value: "http://auth-service:8081"
            - name: JWT_AUDIENCE
              value: "pharmacy-api"
            - name: ENVIRONMENT
              value: "aws"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://pharmacy-observability-opentelemetry-collector:4318/v1/traces"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: secrets
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: pharmacy
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /actuator/prometheus
    prometheus.io/port: "8081"
spec:
  selector:
    app: auth-service
  ports:
    - port: 8081
      targetPort: 8081
