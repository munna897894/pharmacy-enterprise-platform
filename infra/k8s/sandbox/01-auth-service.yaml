# AWS-specific values are rendered by scripts/aws-render-manifests.sh before
# apply. Do not commit live ARNs, endpoints or image URIs in this manifest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: pharmacy
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: auth-service
      initContainers:
        # Fetches DB credentials + JWT RSA keypair from Secrets Manager using
        # the pod's IRSA-scoped IAM role (no static AWS keys anywhere) and
        # writes them to an emptyDir volume the main container reads at boot.
        - name: fetch-secrets
          image: amazon/aws-cli:2.17.0
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              umask 077
              trap 'rm -f /secrets/*.tmp' EXIT
              fetch_secret() {
                secret_arn="$1"
                destination="$2"
                aws secretsmanager get-secret-value --region __AWS_REGION__ \
                  --secret-id "$secret_arn" --query SecretString --output text \
                  > "${destination}.tmp"
                chmod 600 "${destination}.tmp"
                mv "${destination}.tmp" "$destination"
              }
              fetch_secret __AUTH_DB_SECRET_ARN__ /secrets/db_password
              fetch_secret __JWT_PRIVATE_KEY_SECRET_ARN__ /secrets/private_key.pem
              fetch_secret __JWT_PUBLIC_KEY_SECRET_ARN__ /secrets/public_key.pem
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /secrets
      containers:
        - name: auth-service
          image: __AUTH_SERVICE_IMAGE__
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Wrapper reads the password fetched by the init container into an
          # env var (Kubernetes has no native "env from file" mechanism),
          # then execs the image's normal entrypoint.
          command: ["/bin/sh", "-c"]
          args:
            - export DB_PASSWORD="$(cat /secrets/db_password)"; exec java -jar /app/app.jar
          ports:
            - containerPort: 8081
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=50 -XX:+UseG1GC"
            - name: DB_HOST
              value: "__RDS_ENDPOINT__"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: "auth_service"
            - name: DB_USER
              value: "auth_user"
            - name: JWT_PRIVATE_KEY_PATH
              value: "/secrets/private_key.pem"
            - name: JWT_PUBLIC_KEY_PATH
              value: "/secrets/public_key.pem"
            - name: JWT_ISSUER
              value: "http://auth-service:8081"
            - name: JWT_AUDIENCE
              value: "pharmacy-api"
            - name: ENVIRONMENT
              value: "aws"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://pharmacy-observability-opentelemetry-collector.pharmacy-observability.svc.cluster.local:4318/v1/traces"
            - name: TRACING_SAMPLING_PROBABILITY
              value: "1.0"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              cpu: 75m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: secrets
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: pharmacy
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /actuator/prometheus
    prometheus.io/port: "8081"
spec:
  selector:
    app: auth-service
  ports:
    - port: 8081
      targetPort: 8081
