# Rendered and applied ONLY when gateway_exposure=alb-https. In the default
# port-forward mode Terraform creates no ALB controller IAM role, the
# controller is not installed, and this file is not rendered.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-load-balancer-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: aws-load-balancer-controller
    app.kubernetes.io/component: controller
  annotations:
    eks.amazonaws.com/role-arn: __ALB_CONTROLLER_ROLE_ARN__
