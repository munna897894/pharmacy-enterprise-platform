server:
  port: 8085
  servlet:
    context-path: /

spring:
  application:
    name: inventory-service
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
        type:
          preferred_uuid_jdbc_type: CHAR
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3307}/${DB_NAME:pharmacy_inventory}
    username: ${DB_USER:inventory_user}
    password: ${DB_PASSWORD:inventory_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      max-poll-records: 100
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

management:
  observations:
    enable:
      # Outbox relays continue the trace stored with each outbox row; a scheduler span would otherwise become the parent.
      "[tasks.scheduled.execution]": false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      service: inventory-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}

logging:
  level:
    root: INFO
    com.jagapathi.pharmacy: DEBUG
  pattern:
    correlation: "[%X{correlationId:-},%X{traceId:-},%X{spanId:-}]"
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} [%X{correlationId:-},%X{traceId:-},%X{spanId:-}] service=inventory-service environment=${ENVIRONMENT:local} - %msg %kvp%n"

---
spring:
  config:
    activate:
      on-profile: "!local"
logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
        environment: ${ENVIRONMENT:prod}
