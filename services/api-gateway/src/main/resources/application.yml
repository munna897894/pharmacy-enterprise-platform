spring:
  application:
    name: api-gateway
  reactor:
    context-propagation: auto
  cloud:
    gateway:
      default-filters:
        - name: RewritePath
          args:
            regexp: "^/api/v1/(?<segment>.*)"
            replacement: "/api/v1/${segment}"
      httpserver:
        connect-timeout: 30000
        response-timeout: 30000
      server:
        webflux:

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${AUTH_SERVICE_HOST:auth-service}:${AUTH_SERVICE_PORT:8081}
          jwk-set-uri: http://${AUTH_SERVICE_HOST:auth-service}:${AUTH_SERVICE_PORT:8081}/api/v1/auth/.well-known/jwks.json

auth-service:
  jwks-uri: http://${AUTH_SERVICE_HOST:auth-service}:${AUTH_SERVICE_PORT:8081}/api/v1/auth/.well-known/jwks.json

gateway:
  cors:
    allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:4200,http://localhost:4200,https://app.example.com}

rate-limit:
  per-user-per-minute: 100
  per-ip-per-minute: 1000

server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 10
    max-connections: 2000
    accept-count: 100
    connection-timeout: 30000

management:
  # Actuator lives on an internal port that the Kubernetes Service/Ingress never exposes,
  # so Prometheus can scrape without making gateway metrics publicly readable.
  server:
    port: ${MANAGEMENT_SERVER_PORT:9081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
      service: ${spring.application.name}
      environment: ${ENVIRONMENT:local}
    web:
      server:
        request:
          autotime:
            enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}

logging:
  structured:
    json:
      add:
        service: ${spring.application.name}
        environment: ${ENVIRONMENT:prod}
  level:
    root: INFO
    com.jagapathi.pharmacy.gateway: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{ISO8601} %p %c [%t] [%X{correlationId:-},%X{traceId:-},%X{spanId:-}] %msg%n"
    file: "%d{ISO8601} %p %c [%t] [%X{correlationId:-},%X{traceId:-},%X{spanId:-}] %msg%n"
  file:
    name: logs/api-gateway.log
    max-size: 10MB
    max-history: 30

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
