spring:
  application:
    name: notification-service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        type:
          preferred_uuid_jdbc_type: BINARY
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3307}/${DB_NAME:pharmacy_notification}
    username: ${DB_USER:pharmacy_notification}
    password: ${DB_PASSWORD:pharmacy_notification}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:host.docker.internal:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    template:
      observation-enabled: true
  cloud:
    function:
      definition: "orderEventConsumer;paymentEventConsumer;prescriptionEventConsumer"
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:host.docker.internal:9092}
          auto-add-partitions: false
          enable-observation: true
        bindings:
          orderEventConsumer-in-0:
            consumer:
              enableDlq: true
              dlqName: pharmacy.order.events.v1.dlt
              dlqPartitions: 1
              # New groups replay from the beginning; handlers are idempotent via processed_events.
              startOffset: earliest
          paymentEventConsumer-in-0:
            consumer:
              enableDlq: true
              dlqName: pharmacy.payment.events.v1.dlt
              dlqPartitions: 1
              startOffset: earliest
          prescriptionEventConsumer-in-0:
            consumer:
              enableDlq: true
              dlqName: pharmacy.prescription.events.v1.dlt
              dlqPartitions: 1
              startOffset: earliest
      bindings:
        orderEventConsumer-in-0:
          destination: pharmacy.order.events.v1
          group: notification-order-events-v1
          consumer:
            max-attempts: 3
        paymentEventConsumer-in-0:
          destination: pharmacy.payment.events.v1
          group: notification-payment-events-v1
          consumer:
            # Payment events can outrun the OrderCreated projection; retry with backoff before DLT.
            max-attempts: 5
            back-off-initial-interval: 1000
            back-off-multiplier: 2.0
            back-off-max-interval: 8000
        prescriptionEventConsumer-in-0:
          destination: pharmacy.prescription.events.v1
          group: notification-prescription-events-v1
          consumer:
            max-attempts: 3
  mail:
    host: localhost
    port: 1025
    username: 
    password: 
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth-service:8081
          jwk-set-uri: http://auth-service:8081/api/v1/auth/.well-known/jwks.json
  
server:
  port: 8089
  servlet:
    context-path: /
    
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      service: notification-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}
  health:
    # No SMTP server is provisioned in local/dev compose (EmailSender best-effort
    # logs/no-ops when delivery fails); the mail auto-configured health indicator
    # otherwise always reports DOWN (connection refused to the placeholder
    # localhost:1025 host) and drags down the whole liveness/readiness aggregate.
    mail:
      enabled: false
    probes:
      enabled: true

external-service:
  url: http://external-mock-service:8080

customer:
  service:
    base-url: ${CUSTOMER_SERVICE_BASE_URL:http://customer-service:8083}

logging:
  level:
    root: INFO
    com.jagapathi.pharmacy: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ} [%thread] %-5level %logger{36} [%X{correlationId:-},%X{traceId:-},%X{spanId:-}] service=notification-service environment=${ENVIRONMENT:local} - %msg %kvp%n"

---
spring:
  config:
    activate:
      on-profile: "!local"
logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
        environment: ${ENVIRONMENT:prod}

notification:
  email:
    # simulated (default) records delivery without SMTP; smtp sends through spring.mail.*
    mode: ${NOTIFICATION_EMAIL_MODE:simulated}
