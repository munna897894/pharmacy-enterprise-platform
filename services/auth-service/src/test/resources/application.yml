spring:
  application:
    name: auth-service-test
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  flyway:
    enabled: false

server:
  port: 0

jwt:
  private-key-path: src/test/resources/keys/private_key.pem
  public-key-path: src/test/resources/keys/public_key.pem

logging:
  level:
    root: WARN
    com.jagapathi.pharmacy: INFO
