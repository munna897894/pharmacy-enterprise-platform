spring:
  application:
    name: external-mock-service
  profiles:
    default: local

server:
  port: ${EXTERNAL_MOCK_SERVICE_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}
  info:
    env:
      enabled: true

info:
  app:
    name: external-mock-service
    description: Initial bootstrap module for controllable external integrations
    javaVersion: ${JAVA_VERSION:21}

logging:
  pattern:
    correlation: "[%X{correlationId:-},%X{traceId:-},%X{spanId:-}]"

---
spring:
  config:
    activate:
      on-profile: "!local"
logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
        environment: ${ENVIRONMENT:prod}
