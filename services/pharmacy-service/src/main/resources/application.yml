server:
  port: 8084
  servlet:
    context-path: /

spring:
  application:
    name: pharmacy-service
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
        type:
          preferred_uuid_jdbc_type: CHAR
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3307}/${DB_NAME:pharmacy_pharmacy}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:pharmacy_user}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      service: pharmacy-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}

logging:
  level:
    root: INFO
    com.jagapathi.pharmacy: DEBUG
  pattern:
    correlation: "[%X{correlationId:-},%X{traceId:-},%X{spanId:-}]"

security:
  jwt:
    issuer: ${JWT_ISSUER:http://auth-service:8081}
    audience: ${JWT_AUDIENCE:pharmacy-api}
    jwks-uri: ${JWT_JWK_SET_URI:http://auth-service:8081/api/v1/auth/.well-known/jwks.json}

---
spring:
  config:
    activate:
      on-profile: "!local"
logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
        environment: ${ENVIRONMENT:prod}
